<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>W0OAR | Member Login</title>
    <link rel="stylesheet" href="styles\login.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Signika:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
	<link rel="icon" type="image/x-icon" href="/images/favicon.ico">
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">
	<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
	<meta name="msapplication-TileColor" content="#da532c">
	<meta name="theme-color" content="#ffffff">
  </head>
  <body>

    <div class="sign-up-form">
		<div class="sign-up-form-logo">
			<img src="loginmedia\OARSlogo.png"/>
		</div>
		<div class="go-to-login">
			<p id="su-email-text">Sign up with Email.</p>
			<span id="sign-in-text">Already have an account?</span> <span id="sign-in">Sign in</span>
		</div>
      <form>
        <input type="email" class="input-box" placeholder="Email">
      </form>
		<div class="signup">
          <a href="login.html" class="btn">Continue Sign Up</a>
        </div>
		<div class="termsandconditions">
			<span id="terms-text">By signing up your agree to our</span> <span id="terms">Terms and Conditions</span>
		</div>
		<div class="privacy-policy">
			<p>Privacy Policy</p>
		</div>
	  </div>
  </body>
</html>
